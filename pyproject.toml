[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "malhash"
version = "1.0.0"
description = "Cross-platform hashing toolkit for malware analysts and DFIR professionals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MalHash contributors"}]
keywords = ["hashing", "digital forensics", "incident response", "malware analysis", "ssdeep"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["ppdeep==20260221"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<6.13"]
algorithms = [
    "blake3>=1.0,<2",
    "pefile>=2024.8.26",
    "tlsh-python==0.1.0; python_version < '3.13' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "py-tlsh>=5,<6; python_version >= '3.13' or (platform_machine != 'AMD64' and platform_machine != 'x86_64')",
]
all = ["malhash[gui,algorithms]"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
build = ["build>=1.2,<2", "pyinstaller>=6.17,<7", "twine>=6.1,<7"]

[project.scripts]
malhash = "malhash.cli:main"

[project.gui-scripts]
malhash-gui = "malhash.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malhash = ["locales/*.json", "resources/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises application entry points or external reference tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
