name: Draft release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify tag and archive command
        run: |
          python scripts/release_assets.py verify-tag
          python scripts/release_assets.py package --help
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install '.[all,build]' 'PySide6-Essentials==6.11.3'
      - name: Prepare the Windows x64 installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'malhash-inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') {
            throw 'Inno Setup compiler checksum mismatch'
          }
          $arguments = "/PORTABLE=1 /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=""$compilerDir"""
          $install = Start-Process -FilePath $package -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler setup exited with $($install.ExitCode)" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ISCC=$compilerDir\ISCC.exe"
      - name: Build and smoke-test native applications and Windows downloads
        run: python scripts/build_release.py
      - name: Stage native release archives and Qt source metadata
        shell: bash
        run: |
          python scripts/release_assets.py package dist transfer/archives --target "${{ matrix.target }}"
          cp dist/*.qt-sources.json transfer/
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: transfer/
          if-no-files-found: error
          compression-level: 0

  distributions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/release_assets.py verify-tag
      - run: python -m pip install '.[build]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Stage the source archive and zipped wheel
        run: python scripts/release_assets.py package dist transfer/archives --target python
      - uses: actions/upload-artifact@v6
        with:
          name: release-python
          path: transfer/
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: [native, distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: collected
      - name: Collect exact Qt source and archive SHA-256 checksums
        run: python scripts/release_assets.py checksums collected/archives --archive --download-qt-source --qt-manifests collected
      - name: Verify archive checksums
        shell: bash
        working-directory: collected/archives
        run: unzip -p SHA256SUMS.zip SHA256SUMS | sha256sum --strict --check -
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        working-directory: collected/archives
        run: |
          shopt -s nullglob
          assets=(*.zip *.tar.gz *.tar.xz)
          stem="malhash-${RELEASE_TAG#v}"
          wheels=("$stem-"*.whl.zip)
          (( ${#wheels[@]} > 0 )) || { echo "Missing Python wheel archive"; exit 1; }
          required_archives=("$stem-windows-x64.zip" "$stem"-linux-{x64,arm64}.tar.gz
            "$stem"-macos-{x64,arm64}.zip MalHash-Windows-x64-{Portable,Setup}.zip
            "$stem.tar.gz" "${wheels[@]}" SHA256SUMS.zip)
          for required in "${required_archives[@]}"; do
            [[ -s "$required" ]] || { echo "Missing release archive: $required"; exit 1; }
          done
          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets); then
            if [[ $(jq -r '.isDraft' <<< "$release") != true ]]; then
              echo "Release is already published"
              exit 1
            fi
            legacy=()
            while IFS= read -r name; do
              case "$name" in
                *.zip|*.tar.gz|*.tar.xz) continue ;;
                MalHash.exe|MalHash-Setup.exe|SHA256SUMS) legacy+=("$name") ;;
                malhash-*.whl)
                  [[ -s "$name.zip" ]] || { echo "Missing replacement archive for $name"; exit 1; }
                  legacy+=("$name") ;;
                *) echo "Unexpected loose file in the draft: $name"; exit 1 ;;
              esac
            done < <(jq -r '.assets[].name' <<< "$release")
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            for name in "${legacy[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --generate-notes
          fi
