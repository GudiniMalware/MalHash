name: Feature request
description: Suggest a change to the offline hashing toolkit.
title: '[Feature] '
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the workflow and the gap you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected outcome and which interfaces or export formats it affects.
    validations:
      required: true
